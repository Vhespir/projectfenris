services:
  db:
    image: postgis/postgis:16-3.4
    container_name: fenris_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - fenris-network

  api:
    build: ./api
    container_name: fenris_api
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3001"
    environment:
      DATABASE_URL: postgres://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      JWT_SECRET: ${JWT_SECRET}
      PORT: 3001
      NODE_ENV: production
    depends_on:
      - db
    networks:
      - fenris-network

  worker:
    build: ./worker
    container_name: fenris_worker
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      AIRNOW_API_KEY: ${AIRNOW_API_KEY}
      NODE_ENV: production
    depends_on:
      - db
    networks:
      - fenris-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: fenris_frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    networks:
      - fenris-network

volumes:
  postgres-data:

networks:
  fenris-network:
    driver: bridge
