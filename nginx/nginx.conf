events {
  worker_connections 1024;
}

http {
  server_tokens off;

  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-XSS-Protection "1; mode=block" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;

  upstream frontend {
    server 127.0.0.1:3000;
  }

  upstream api {
    server 127.0.0.1:3001;
  }

  # HTTP — redirect to HTTPS in production, serve directly in dev
  server {
    listen 80;
    server_name localhost projectfenris.com www.projectfenris.com;

    # Uncomment when TLS is set up (run certbot first):
    # return 301 https://$host$request_uri;

    location / {
      proxy_pass http://frontend;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection 'upgrade';
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_cache_bypass $http_upgrade;
    }

    location /api/ {
      proxy_pass http://api/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_cache_bypass $http_upgrade;
      client_max_body_size 3m;
    }

    location /uploads/ {
      proxy_pass http://api/uploads/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      expires 1y;
      add_header Cache-Control "public";
    }

    location /socket.io {
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection 'upgrade';
      proxy_set_header Host $host;
    }
  }

  # HTTPS — uncomment and configure once you have TLS certs via certbot
  # server {
  #   listen 443 ssl http2;
  #   server_name projectfenris.com www.projectfenris.com;
  #
  #   ssl_certificate     /etc/letsencrypt/live/projectfenris.com/fullchain.pem;
  #   ssl_certificate_key /etc/letsencrypt/live/projectfenris.com/privkey.pem;
  #   ssl_protocols       TLSv1.2 TLSv1.3;
  #   ssl_ciphers         HIGH:!aNULL:!MD5;
  #   ssl_session_cache   shared:SSL:10m;
  #
  #   add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  #
  #   location / { ... same as above ... }
  # }
}
