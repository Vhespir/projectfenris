services:
  db:
    image: postgis/postgis:16-3.4
    container_name: fenris_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - fenris-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./api
      network: host
    container_name: fenris_api
    restart: unless-stopped
    network_mode: host
    environment:
      DATABASE_URL: postgres://${DB_USER}:${DB_PASSWORD}@127.0.0.1:5432/${DB_NAME}
      JWT_SECRET: ${JWT_SECRET}
      PORT: 3001
      RESEND_API_KEY: ${RESEND_API_KEY}
      EMAIL_FROM: ${EMAIL_FROM}
      BASE_URL: ${BASE_URL}
      AIRNOW_API_KEY: ${AIRNOW_API_KEY}
    volumes:
      - ./api:/app
      - /app/node_modules
      - uploads-data:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  worker:
    build:
      context: ./worker
      network: host
    container_name: fenris_worker
    restart: unless-stopped
    network_mode: host
    environment:
      DATABASE_URL: postgres://${DB_USER}:${DB_PASSWORD}@127.0.0.1:5432/${DB_NAME}
      AIRNOW_API_KEY: ${AIRNOW_API_KEY}
      RESEND_API_KEY: ${RESEND_API_KEY}
      EMAIL_FROM: ${EMAIL_FROM}
      BASE_URL: ${BASE_URL}
    volumes:
      - ./worker:/app
      - /app/node_modules
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      network: host
    container_name: fenris_frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NODE_ENV: development
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    networks:
      - fenris-network

volumes:
  postgres-data:
  uploads-data:

networks:
  fenris-network:
    driver: bridge
