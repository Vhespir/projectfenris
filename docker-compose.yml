services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - fenris-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      JWT_SECRET: ${JWT_SECRET}
      PORT: 3001
      RESEND_API_KEY: ${RESEND_API_KEY}
      EMAIL_FROM: ${EMAIL_FROM}
      BASE_URL: ${BASE_URL}
      AIRNOW_API_KEY: ${AIRNOW_API_KEY}
      EIA_API_KEY: ${EIA_API_KEY}
      BLS_API_KEY: ${BLS_API_KEY}
      FRED_API_KEY: ${FRED_API_KEY}
    volumes:
      - uploads-data:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    networks:
      - fenris-network
      - coolify
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=coolify"
      # /api/* — strip the /api prefix before forwarding
      - "traefik.http.routers.fenris-api-http.rule=Host(`projectfenris.com`) && PathPrefix(`/api`)"
      - "traefik.http.routers.fenris-api-http.entrypoints=http"
      - "traefik.http.routers.fenris-api-http.middlewares=redirect-to-https"
      - "traefik.http.routers.fenris-api-https.rule=Host(`projectfenris.com`) && PathPrefix(`/api`)"
      - "traefik.http.routers.fenris-api-https.entrypoints=https"
      - "traefik.http.routers.fenris-api-https.tls.certresolver=letsencrypt"
      - "traefik.http.routers.fenris-api-https.middlewares=fenris-strip-api"
      - "traefik.http.routers.fenris-api-https.service=fenris-api"
      - "traefik.http.middlewares.fenris-strip-api.stripprefix.prefixes=/api"
      # /uploads/* and /socket.io — pass through as-is
      - "traefik.http.routers.fenris-passthrough-http.rule=Host(`projectfenris.com`) && (PathPrefix(`/uploads`) || PathPrefix(`/socket.io`))"
      - "traefik.http.routers.fenris-passthrough-http.entrypoints=http"
      - "traefik.http.routers.fenris-passthrough-http.middlewares=redirect-to-https"
      - "traefik.http.routers.fenris-passthrough-https.rule=Host(`projectfenris.com`) && (PathPrefix(`/uploads`) || PathPrefix(`/socket.io`))"
      - "traefik.http.routers.fenris-passthrough-https.entrypoints=https"
      - "traefik.http.routers.fenris-passthrough-https.tls.certresolver=letsencrypt"
      - "traefik.http.routers.fenris-passthrough-https.service=fenris-api"
      - "traefik.http.services.fenris-api.loadbalancer.server.port=3001"

  worker:
    build:
      context: ./worker
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      AIRNOW_API_KEY: ${AIRNOW_API_KEY}
      RESEND_API_KEY: ${RESEND_API_KEY}
      EMAIL_FROM: ${EMAIL_FROM}
      BASE_URL: ${BASE_URL}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - fenris-network

  # Local nightly pg_dump, kept 14 days, pruned automatically. Local-disk only --
  # protects against a bad deploy / volume mixup, not against losing the VPS
  # itself. See backup/backup.sh for the off-site (B2) follow-up note.
  backup:
    build:
      context: ./backup
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - backup-data:/backups
    depends_on:
      db:
        condition: service_healthy
    networks:
      - fenris-network

  frontend:
    # Was running the bare Vite dev server (unminified, not meant for public
    # internet exposure) as "prod" -- Dockerfile.prod actually builds a static
    # production bundle and serves it with nginx. VITE_CESIUM_ION_TOKEN moved
    # from a runtime env var to a build arg accordingly: Vite bakes VITE_-
    # prefixed vars into the bundle at build time, not request time, when it's
    # a real build rather than the dev server. Changing this value now needs a
    # redeploy (which rebuilds the image) to take effect, not just a restart.
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_CESIUM_ION_TOKEN: ${VITE_CESIUM_ION_TOKEN}
    restart: unless-stopped
    networks:
      - fenris-network
      - coolify
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=coolify"
      - "traefik.http.routers.fenris-frontend-http.rule=Host(`projectfenris.com`)"
      - "traefik.http.routers.fenris-frontend-http.entrypoints=http"
      - "traefik.http.routers.fenris-frontend-http.middlewares=redirect-to-https"
      - "traefik.http.routers.fenris-frontend-https.rule=Host(`projectfenris.com`)"
      - "traefik.http.routers.fenris-frontend-https.entrypoints=https"
      - "traefik.http.routers.fenris-frontend-https.tls.certresolver=letsencrypt"
      - "traefik.http.routers.fenris-frontend-https.service=fenris-frontend"
      - "traefik.http.routers.fenris-frontend-https.middlewares=fenris-security-headers"
      - "traefik.http.services.fenris-frontend.loadbalancer.server.port=3000"
      # The api container gets these via @fastify/helmet already; the frontend
      # is a bare Vite server with no headers middleware of its own, so it
      # gets nothing unless Traefik adds it here.
      - "traefik.http.middlewares.fenris-security-headers.headers.customresponseheaders.X-Frame-Options=SAMEORIGIN"
      - "traefik.http.middlewares.fenris-security-headers.headers.customresponseheaders.X-Content-Type-Options=nosniff"
      - "traefik.http.middlewares.fenris-security-headers.headers.customresponseheaders.Referrer-Policy=strict-origin-when-cross-origin"
      - "traefik.http.middlewares.fenris-security-headers.headers.customresponseheaders.Permissions-Policy=camera=(), microphone=(), geolocation=(self)"
      - "traefik.http.middlewares.fenris-security-headers.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.fenris-security-headers.headers.stsIncludeSubdomains=true"
      # www.projectfenris.com -> permanent redirect to bare apex on both entrypoints.
      # The session cookie has no explicit domain, so it's pinned to whichever
      # exact host the browser used -- serving both hosts live (no redirect)
      # would silently log users out depending on which one they landed on.
      # No capture group here on purpose. $-escaping for a $1/${1} backreference
      # through Docker Compose's label interpolation into Traefik was tried twice
      # (two dollar signs, then four) and both landed as literal, unexpanded text
      # in the redirect target -- Traefik was not treating either as a
      # backreference. Rather than keep guessing at escaping through a redeploy
      # cycle each time, this redirects to the bare root instead of preserving
      # the path. Deep links via www won't carry their path over; acceptable
      # tradeoff for a domain that's not the canonical one anyway.
      - "traefik.http.middlewares.fenris-www-redirect.redirectregex.regex=^https?://www\\.projectfenris\\.com/.*"
      - "traefik.http.middlewares.fenris-www-redirect.redirectregex.replacement=https://projectfenris.com/"
      - "traefik.http.middlewares.fenris-www-redirect.redirectregex.permanent=true"
      - "traefik.http.routers.fenris-www-http.rule=Host(`www.projectfenris.com`)"
      - "traefik.http.routers.fenris-www-http.entrypoints=http"
      - "traefik.http.routers.fenris-www-http.middlewares=fenris-www-redirect"
      - "traefik.http.routers.fenris-www-http.service=fenris-frontend"
      - "traefik.http.routers.fenris-www-https.rule=Host(`www.projectfenris.com`)"
      - "traefik.http.routers.fenris-www-https.entrypoints=https"
      - "traefik.http.routers.fenris-www-https.tls.certresolver=letsencrypt"
      - "traefik.http.routers.fenris-www-https.middlewares=fenris-www-redirect"
      - "traefik.http.routers.fenris-www-https.service=fenris-frontend"

volumes:
  # CAUTION, read before touching either of these two:
  #
  # Coolify's Persistent Storage tab shows the volumes it's actually tracking
  # for this app as `<app-id>_postgres-data` / `<app-id>_uploads-data` -- NOT
  # the `projectfenris-site_*` names declared below via `external`/`name`.
  # The site runs fine on real, accumulated data regardless, which means
  # Coolify is computing its own volume name for Docker-Compose-buildpack
  # apps and is not actually honoring this override. Do not trust the `name:`
  # values here as ground truth for what's really mounted.
  #
  # This matters because of what happened on 2026-05-30: this app's very
  # first Coolify deploy started against a brand-new empty volume, and
  # nothing from the prior bare-metal deployment was ever migrated into it --
  # all 22 migrations ran fresh in one ~250ms burst that day, and no account
  # or post from before that date survived. It probably wasn't a name
  # mismatch so much as: standing up a new Coolify app just doesn't import
  # data from an unrelated old volume on its own, and that step was never
  # done by hand either.
  #
  # Before changing anything below, or moving this app to a new Coolify
  # instance/server, get ground truth first: `docker volume ls` and
  # `docker inspect <db container>` on the actual host, not this file and
  # not the Coolify UI. Whatever you do, never delete/recreate the Coolify
  # application resource itself without a fresh pg_dump in hand first --
  # that's what actually severs the binding to real data.
  postgres-data:
    external: true
    name: projectfenris-site_postgres-data
  uploads-data:
    external: true
    name: projectfenris-site_uploads-data
  # Not external, on purpose -- this one's brand new, so there's nothing
  # pre-existing to reattach to. Compose manages it normally.
  backup-data:

networks:
  fenris-network:
    driver: bridge
  coolify:
    external: true
    name: coolify
